<div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
  <div *ngFor="let watch of watches" class="watchlist">
    <app-watch-list-item [Watch]="watch"></app-watch-list-item>


  <button (click)="editWatch(watch)">Edit</button>
  <button (click)="deleteWatch(watch.id)">Delete</button>
</div>
